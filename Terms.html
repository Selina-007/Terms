ckground:var(--good-bg);border-color:var(--good-line)}.result.basic{background:var(--basic-bg);border-color:var(--basic-line)}.result.wrong{background:var(--bad-bg);border-color:var(--bad-line)}.result-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}.result-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:950;flex:none}.correct .result-icon{background:#d5f1e4;color:var(--good)}.basic .result-icon{background:#ffebbb;color:var(--basic)}.wrong .result-icon{background:#ffdfe1;color:var(--bad)}.result-title{font-size:19px;font-weight:900}.result-sub{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}.reference-title{font-size:12px;font-weight:850;color:var(--muted);margin:13px 0 7px}.reference{white-space:pre-wrap;line-height:1.75;color:#30394c;background:rgba(255,255,255,.64);border-radius:11px;padding:11px 13px}.grade-title{font-size:12px;color:var(--muted);font-weight:750;margin:15px 0 8px}.grade-row{display:flex;gap:8px;flex-wrap:wrap}.grade{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;cursor:pointer;color:#4d566a;font-weight:780}.grade.selected{color:#fff;border-color:transparent}.grade[data-grade="correct"].selected{background:var(--good)}.grade[data-grade="basic"].selected{background:var(--basic)}.grade[data-grade="wrong"].selected{background:var(--bad)}.saved-note{font-size:12px;color:var(--muted);margin-top:8px;min-height:18px}.firework{position:absolute;inset:50% auto auto 50%;width:1px;height:1px;pointer-events:none}.spark{position:absolute;left:0;top:0;width:5px;height:5px;border-radius:50%;background:var(--spark,#6f6de8);animation:burst .72s ease-out forwards;transform:rotate(var(--angle)) translateX(0);opacity:0}.spark:nth-child(3n){--spark:#f3b43f}.spark:nth-child(3n+1){--spark:#39b887}.spark:nth-child(3n+2){--spark:#7f72ed}@keyframes burst{0%{opacity:1;transform:rotate(var(--angle)) translateX(2px) scale(1)}70%{opacity:1}100%{opacity:0;transform:rotate(var(--angle)) translateX(var(--distance)) scale(.2)}}.reveal-card{display:none;margin-top:18px;border:1px solid #dfe4ee;background:#fafbff;border-radius:17px;padding:18px}.reveal-card.show{display:block}.tag{display:inline-block;font-size:12px;font-weight:800;color:#5b6590;background:#edf0ff;border-radius:999px;padding:6px 9px;margin-bottom:10px}.meaning{white-space:pre-wrap;line-height:1.85;font-size:16px}.empty{margin:auto;text-align:center;max-width:500px}.empty h2{font-size:29px;margin:0 0 10px}.empty p{color:var(--muted);line-height:1.75}.summary{display:none}.summary.show{display:block}.summary h2{font-size:31px;margin-top:0}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.summary-card{border:1px solid var(--line);border-radius:15px;padding:18px;text-align:center}.summary-card b{display:block;font-size:31px}.source-note{margin-top:auto;padding-top:20px;color:var(--muted);font-size:12px;line-height:1.6}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#20283c;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}

<body>
<div class="wrap">
<header class="hero"><div><div class="eyebrow">TERM LAB</div><h1>术语学习 · 测试与复习</h1><p>运营专业双向测试；运营口语、技术口语与 Reddit 黑话点击查看含义。</p></div><div class="pill" id="bankCount"></div></header>
<main class="layout">
<aside class="panel">
<h2>本轮设置</h2>
<div class="field"><label for="deck">学习内容</label><select id="deck"><option value="quiz">运营专业 · 双向测试</option><option value="运营口语">运营口语 · 点击复习</option><option value="技术口语">技术口语 · 点击复习</option><option value="Reddit黑话">Reddit 黑话 · 点击复习</option></select></div>
<div class="field" id="directionField"><label for="direction">测试方向</label><select id="direction"><option value="mixed">中英双向混合</option><option value="en-zh">英文 → 中文</option><option value="zh-en">中文 → 英文</option></select></div>
<div class="field"><label for="count">题目数量</label><select id="count"><option value="10">10 题</option><option value="20" selected>20 题</option><option value="30">30 题</option><option value="all">全部</option></select></div>
<button class="start" id="start">开始学习</button>
<div class="stats"><div class="stat"><b id="goodStat">0</b><span>答对/记住</span></div><div class="stat"><b id="basicStat">0</b><span>基本正确</span></div><div class="stat"><b id="badStat">0</b><span>还不熟</span></div></div>
<div class="mini">记录只保存在当前浏览器。刷新或下次打开时仍会保留。</div><button class="reset" id="reset">清除本地学习记录</button>
</aside>
<section class="quiz">
<div id="empty" class="empty"><h2>准备好了吗？</h2><p>选择内容和题目数量后开始。测试题采用宽松匹配，不要求逐字一致。</p></div>
<div id="question" hidden>
<div class="topline"><span class="mode" id="modeLabel"></span><span class="counter" id="counter"></span></div><div class="progress"><i id="bar"></i></div>
<div class="prompt-label" id="promptLabel"></div><div class="prompt" id="prompt"></div><div class="context" id="context"></div>
<div id="quizArea"><div class="instruction" id="instruction"></div><input class="answer-input" id="answer" autocomplete="off" placeholder="在这里输入答案……"><div class="actions"><button class="btn primary" id="submit">提交答案</button><button class="btn ghost" id="reveal">直接看答案</button><button class="btn ghost next" id="next" hidden>下一题</button></div>
<div class="result" id="result"><div class="result-head"><div class="result-icon" id="resultIcon"></div><div><div class="result-title" id="resultTitle"></div><div class="result-sub" id="resultSub"></div></div></div><div class="reference-title">原词条与含义</div><div class="reference" id="reference"></div><div class="grade-title">需要修正判断吗？</div><div class="grade-row"><button class="grade" data-grade="correct">答对啦</button><button class="grade" data-grade="basic">基本正确</button><button class="grade" data-grade="wrong">还不熟哦</button></div><div class="saved-note" id="savedNote"></div></div></div>
<div id="reviewArea" hidden><div class="instruction">先回忆含义，再点击卡片或按钮查看答案。</div><div class="actions"><button class="btn primary" id="showMeaning">显示含义 / 备注</button><button class="btn ghost next" id="reviewNext" hidden>下一条</button></div><div class="reveal-card" id="revealCard"><div class="tag" id="noteTag"></div><div class="meaning" id="meaning"></div><div class="grade-title">你的熟悉程度</div><div class="grade-row"><button class="grade review-grade" data-grade="correct">记住了</button><button class="grade review-grade" data-grade="basic">有点模糊</button><button class="grade review-grade" data-grade="wrong">还不熟</button></div><div class="saved-note" id="reviewSaved"></div></div></div>
<div class="source-note" id="sourceNote"></div>
</div>
<div class="summary" id="summary"><h2>本轮完成</h2><p>学习结果已保存在当前浏览器。</p><div class="summary-grid"><div class="summary-card"><b id="sumGood">0</b><span>答对 / 记住</span></div><div class="summary-card"><b id="sumBasic">0</b><span>基本正确 / 模糊</span></div><div class="summary-card"><b id="sumBad">0</b><span>还不熟</span></div></div><button class="btn primary" id="again">再来一轮</button></div>
</section></main></div><div class="toast" id="toast"></div>
<script>

及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-276","en":"Conversion Contribution","zh":"转化贡献","meaning":"某个内容/渠道带来的转化比例","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-277","en":"CSAT","zh":"客户满意度评分","meaning":"用户对某个服务或功能的满意程度","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-278","en":"Empower","zh":"赋能","meaning":"给资源/工具/权限让他人更好做事","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-279","en":"Granularity","zh":"颗粒度","meaning":"细节的精细程度（“颗粒度不够”=细节不够细）","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-280","en":"Gray release","zh":"灰度发布","meaning":"先给小部分用户推新功能，再逐步扩大","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-281","en":"Lagging indicator","zh":"滞后指标","meaning":"事后验证的结果性指标","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-282","en":"Leading indicator","zh":"先行指标","meaning":"能预测未来结果的前置指标","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-283","en":"Leverage","zh":"杠杆/抓手","meaning":"能撬动更大结果的切入点","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-284","en":"Metrics → Problem → Event Tracking → Review","zh":"看指标→拆问题→设计埋点→运营复盘","meaning":"运营复盘标准路线","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-285","en":"North Star Metric","zh":"北极星指标","meaning":"公司最核心的、能驱动长期价值的一个指标","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-286","en":"NPS","zh":"净推荐值","meaning":"用户愿意推荐产品的程度（0-10分）","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-287","en":"Onboarding Completion Feedback","zh":"新手教程完成反馈","meaning":"用户完成onboarding后的感受","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-288","en":"Viral","zh":"爆款/病毒式传播","meaning":"内容快速被大量传播","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-289","en":"Self Q&A","zh":"自问自答","meaning":"Reddit运营技巧，用同一账户的不同身份提问和回答","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-290","en":"Landing Page Builder","zh":"落地页构建器","meaning":"CRM/营销工具中用于制作落地页的功能","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"},{"id":"op-291","en":"Mid-sized, High-trust Technical KOLs","zh":"中型、高信任度技术KOL","meaning":"渠道特征描述","section":"6. 抽象运营表达及其他阅读词汇","tier":"第二梯度：被动词汇——阅读时迅速理解"}],"review":{"运营口语":[{"id":"运营口语-2","en":"prosumer segment","meaning":"介于普通消费者和专业用户之间的用户群体，即高阶消费者、半专业用户或有较强技术需求的家庭用户。","note":""},{"id":"运营口语-3","en":"monthlies","meaning":"每月需要支付的费用，常指月费或月度订阅费。","note":""},{"id":"运营口语-4","en":"ongoing fee","meaning":"持续产生的费用，不一定按月收取。","note":""},{"id":"运营口语-5","en":"recurring cost","meaning":"经常性、周期性发生的成本，例如订阅费、维护费和云服务费。","note":""},{"id":"运营口语-6","en":"top tier","meaning":"最高档、最高等级；谈产品版本时可译为“顶配版/最高档套餐”，不一定指硬件配置。","note":""},{"id":"运营口语-7","en":"free tier","meaning":"免费档、免费套餐。通常只是产品分级中的免费层级，不一定等于功能完整的“免费版”。","note":""},{"id":"运营口语-8","en":"one-stop shop for everything","meaning":"所需功能或服务都能在一个地方获得，即“一站式解决方案”。产品语境中也可理解为“一站式管理”。","note":""},{"id":"运营口语-9","en":"has its place in the market","meaning":"在市场上有自己的适用场景、目标用户或存在价值；不代表它是市场领先者。","note":""},{"id":"运营口语-10","en":"established solution","meaning":"已经成熟、经过市场验证并被广泛采用的解决方案。established 强调成熟度和认可度。","note":""},{"id":"运营口语-11","en":"advanced RMA","meaning":"厂商在收到故障设备之前，先向客户寄出替换设备的RMA流程，即“提前换货”。","note":""},{"id":"运营口语-12","en":"RMA","meaning":"Return Merchandise Authorization，退货或返修授权，也常泛指厂商的退换货售后流程。","note":""},{"id":"运营口语-13","en":"consumer-grade box","meaning":"消费级设备，即主要为普通家庭用户设计，而非企业或专业环境使用的设备。","note":""},{"id":"运营口语-14","en":"turnaround time","meaning":"从提交请求、送修或开始处理，到完成并返回结果所需的总时间；售后语境中常指“维修/换货处理周期”。","note":""},{"id":"运营口语-15","en":"home non-pro user","meaning":"非专业的家庭用户，即不具备专业网络知识的普通家用用户。更自然的写法通常是 non-professional home user。","note":""},{"id":"运营口语-16","en":"marketing buzzword","meaning":"听起来先进、但含义可能模糊或被过度包装的营销热词。根据语气也可译为“营销话术/营销噱头”。","note":""},{"id":"运营口语-17","en":"SKU","meaning":"Stock Keeping Unit，库存量单位。指企业单独跟踪库存的一种产品或产品变体，如不同容量、颜色、配置可能属于不同SKU。","note":""},{"id":"运营口语-18","en":"trade-in/refurb","meaning":"trade-in指以旧换新；refurb是refurbished的简称，指经过检测、维修或整备后重新销售的翻新产品。","note":""},{"id":"运营口语-19","en":"OG box","meaning":"OG意为最早的、初代的、老牌的。OG box在技术社区通常指“初代设备/老款机器”，不一定是“原装包装盒”。","note":""},{"id":"运营口语-20","en":"power user","meaning":"高级用户或重度用户：比普通用户更熟悉产品，会使用高级功能和复杂配置，但不一定是职业人士。","note":""},{"id":"运营口语-21","en":"pro user","meaning":"专业用户，通常因工作或专业任务使用产品。与power user有重叠，但更强调职业或专业用途。","note":""},{"id":"运营口语-22","en":"aggressive pricing","meaning":"激进定价：以明显具有竞争力的价格抢占市场、吸引用户或压制竞争对手，不一定意味着低于成本。","note":""},{"id":"运营口语-23","en":"priced aggressively","meaning":"“定价非常有竞争力”。pricing aggressive不太自然，应写成aggressive pricing或priced aggressively。","note":""},{"id":"运营口语-24","en":"ecosystem lock-in","meaning":"生态锁定：用户购买某品牌的设备或服务后，因为兼容性、数据迁移或使用成本而难以转向其他生态。","note":""},{"id":"运营口语-25","en":"shrink-wrap agreement","meaning":"“拆封生效协议/收缩包装协议”：软件许可条款放在产品包装内外，用户拆封或使用产品即被视为接受条款。","note":""},{"id":"运营口语-26","en":"click-wrap agreement","meaning":"点击同意协议：用户必须点击“I Agree”等按钮，明确表示接受条款。click-wrap中的wrap不是“包装页面”，而是沿用软件许可协议的命名方式。","note":""},{"id":"运营口语-27","en":"MRR","meaning":"Monthly Recurring Revenue，月度经常性收入，指企业每月可预期重复获得的收入。订阅收入是常见来源，但MRR不一定只包含订阅费。","note":""},{"id":"运营口语-28","en":"hassle-free solution","meaning":"省心、操作简单、不需要反复折腾的解决方案。“丝滑”偏重使用流畅，hassle-free更强调麻烦少。","note":""},{"id":"运营口语-29","en":"undertakings","meaning":"普通语境可指项目或艰巨任务；法律、合同语境中通常指正式作出的承诺或承担的义务，不能一概翻译成“配置工作”。","note":""}],"技术口语":[{"id":"技术口语-2","en":"unlab their lives","meaning":"清理家人留下的家庭实验室设备和复杂配置，让生活恢复到普通状态。unlab 是根据 home lab 临时造出的词。","note":"临时造词"},{"id":"技术口语-3","en":"resubnetted my main home network","meaning":"重新规划或划分了家庭主网络的子网/网段，不只是给某台设备重新分配 IP。","note":"行业口语"},{"id":"技术口语-4","en":"devices talk to each other","meaning":"设备之间进行网络通信或建立连接；talk to 不是字面上的“说话”。","note":"/"},{"id":"技术口语-5","en":"box","meaning":"技术语境中常指一台实体设备、服务器、路由器或防火墙设备，需根据上下文判断。","note":"一词多义"},{"id":"技术口语-6","en":"stack","meaning":"可指技术栈、协议栈，或一整套相互配合的软硬件系统。","note":"/"},{"id":"技术口语-7","en":"flow","meaning":"网络语境中通常指一段网络流量或通信行为\n不能简单等同于“网络连接”。","note":"/"},{"id":"技术口语-8","en":"home mesh router kits","meaning":"家用 Mesh 路由器套装，通常包含两台或多台可组成 Mesh 网络的路由设备。","note":"/"},{"id":"技术口语-9","en":"another layer in your defense stack","meaning":"在现有安全体系中增加一层防护。\ndefense stack 指由防火墙、DNS安全、终端防护等组成的多层安全体系。","note":"/"},{"id":"技术口语-10","en":"quarantine","meaning":"将可疑设备、文件或流量隔离起来；既可以表示“隔离”这一动作，也可以指“隔离区”。","note":"/"},{"id":"技术口语-11","en":"power cycle","meaning":"完全断电后重新通电，即“断电重启”。通常比普通的软件重启更彻底。","note":"行业口语"},{"id":"技术口语-12","en":"3x","meaning":"通常表示“三倍”或“三次”；如果修饰设备，也可能表示“三台/三个”，必须结合上下文判断。","note":"缩写与简写"},{"id":"技术口语-13","en":"hook up the box","meaning":"把设备接上线并使其可以使用。根据语境可能包括连接网线、电源、安装以及基础配置。","note":"行业口语"},{"id":"技术口语-14","en":"the internet goes out","meaning":"网络突然中断、掉线或无法使用。强调网络从正常变成不可用。","note":"行业口语"},{"id":"技术口语-15","en":"the internet appears down","meaning":"网络看起来处于中断状态，但说话者还没有完全确认故障原因。appears 表示“表面看来”。","note":"/"},{"id":"技术口语-16","en":"unresponsive","meaning":"设备、程序或界面没有响应，但不一定已经彻底损坏。","note":"/"},{"id":"技术口语-17","en":"crap out","meaning":"设备或软件突然坏掉、死机或停止工作，是比较随意的说法，可译为“挂了/掉链子了”。","note":"行业口语"},{"id":"技术口语-18","en":"slapped into my network","meaning":"很快、很随意地把设备接入现有网络并开始使用，暗含“没有做太多复杂规划或配置”。","note":"行业口语"},{"id":"技术口语-19","en":"in bridge","meaning":"通常是 in bridge mode 的省略，即“处于桥接模式”。设备不再承担完整的路由/NAT功能。","note":"省略表达"},{"id":"技术口语-20","en":"in access point","meaning":"通常指 in access point mode，即“处于AP模式”。更完整的写法是 in AP mode。","note":"省略表达"},{"id":"技术口语-21","en":"AP mode","meaning":"接入点模式。设备主要负责提供Wi‑Fi接入，通常由上级路由器负责DHCP、NAT和路由。","note":"/"},{"id":"技术口语-22","en":"satellites","meaning":"在Mesh Wi‑Fi系统中指连接主路由的卫星节点、子路由或扩展节点，不是太空中的卫星。","note":"/"},{"id":"技术口语-23","en":"PoE","meaning":"Power over Ethernet，以太网供电：使用一根网线同时传输数据和电力。","note":"/"},{"id":"技术口语-24","en":"PoE","meaning":"基础PoE标准，通常指IEEE 802.3af，供电端最高输出约15.4W。适合基础AP、摄像头等低功耗设备。","note":"/"},{"id":"技术口语-25","en":"PoE+","meaning":"功率更高的PoE，通常指IEEE 802.3at，供电端最高约30W，常见AP和摄像头通常够用。","note":"/"},{"id":"技术口语-26","en":"PoE++","meaning":"更高功率的PoE，通常指IEEE 802.3bt，包含不同功率等级，适合高端AP、云台摄像头等高功耗设备。","note":"/"},{"id":"技术口语-27","en":"non-phone auths","meaning":"通常指不通过手机完成的认证或授权，例如安全密钥、密码或桌面端认证。具体含义取决于上下文；auths可能是authentications或authorizations的简写。","note":"省略表达"},{"id":"技术口语-28","en":"ZeroTier","meaning":"一种虚拟组网和远程访问工具，可以通过覆盖网络连接不同地点的设备，作用与Tailscale有相似之处。","note":"/"},{"id":"技术口语-29","en":"dongle","meaning":"插在设备接口上的小型外接硬件，例如USB无线网卡、蓝牙适配器、安全密钥或授权加密狗。具体功能取决于上下文。","note":"一词多义"},{"id":"技术口语-30","en":"SSID","meaning":"Service Set Identifier，Wi‑Fi网络名称，也就是设备搜索无线网络时看到的名字。","note":"/"},{"id":"技术口语-31","en":"USB tethering / USB tether","meaning":"USB网络共享：通过USB线把手机等设备的网络连接共享给电脑或其他设备。","note":"/"},{"id":"技术口语-32","en":"Debian distro","meaning":"Debian发行版。根据上下文，既可能指Debian本身，也可能泛指基于Debian开发的Linux发行版。","note":"/"},{"id":"技术口语-33","en":"distro","meaning":"distribution的简称，通常指Linux发行版，例如Debian、Ubuntu、Fedora和Arch Linux。","note":"/"},{"id":"技术口语-34","en":"builds","meaning":"软件语境中指编译或打包生成的软件版本，可以是正式版、测试版或每日构建版；latest builds不一定等于“最新测试版”。","note":"一词多义"},{"id":"技术口语-35","en":"my homelab build","meaning":"我的家庭实验室搭建方案或整体配置，可能包括服务器、网络设备、软件和部署方式。","note":"一词多义"},{"id":"技术口语-36","en":"PC build","meaning":"一套电脑硬件配置或DIY装机方案，也可以指已经组装完成的电脑。","note":"一词多义"},{"id":"技术口语-37","en":"provision","meaning":"为设备、账号或服务准备所需资源并完成初始化配置，使其能够投入使用。具体可译为“开通、配置、初始化、下发”。","note":"一词多义"},{"id":"技术口语-38","en":"provision a device","meaning":"注册设备、分配必要配置或凭证，并将设备设置为可以正常使用的状态。","note":"一词多义"},{"id":"技术口语-39","en":"provision a user account","meaning":"创建或开通用户账号，并分配权限、许可证、组或其他必要配置。","note":"一词多义"},{"id":"技术口语-40","en":"call out to","meaning":"程序或设备主动向外部系统发起网络请求。例如the app calls out to the cloud service表示应用主动连接云服务。","note":"/"},{"id":"技术口语-41","en":"call back to","meaning":"程序或设备随后回连、回调某个系统。它通常带有“返回原系统”或“按预设地址主动联系”的含义。","note":"/"},{"id":"技术口语-42","en":"reach out to","meaning":"在技术语境中可表示尝试","note":"/"},{"id":"技术口语-43","en":"feeds","meaning":"持续提供并更新数据的来源，例如新闻源、规则源、黑名单或情报源。","note":"/"},{"id":"技术口语-44","en":"threat feeds","meaning":"威胁情报源：持续提供恶意IP、域名、URL、文件哈希或其他威胁指标的数据源。","note":"/"},{"id":"技术口语-45","en":"cloud backhaul","meaning":"将边缘节点、家庭设备、分支机构或接入点产生的流量或数据回传到云端或中心网络。也可能指流量必须绕经云端再到达目标。","note":"/"},{"id":"技术口语-46","en":"highly configurable","meaning":"高度可配置，强调选项多、能够细致调整，适合描述路由器、防火墙和软件。","note":"/"},{"id":"技术口语-47","en":"highly flexible","meaning":"灵活性高，强调能适应不同场景，但不一定表示配置项特别多。","note":"/"},{"id":"技术口语-48","en":"tinker-friendly","meaning":"适合喜欢动手研究、尝试和改造的用户，比较接近“可玩性高”。","note":"社区口语"},{"id":"技术口语-49","en":"DIY-friendly","meaning":"适合自己安装、搭建或改造，强调DIY门槛较低。","note":"社区口语"},{"id":"技术口语-50","en":"feature-rich","meaning":"功能丰富，但不一定代表自由度高或适合折腾\nlots to explore","note":"产品表达"},{"id":"技术口语-51","en":"You can really tweak it.","meaning":"可以对它进行大量细致调整，强调配置自由度和可定制性。","note":"社区口语"},{"id":"技术口语-52","en":"You can geek out on it.","meaning":"技术爱好者可以深入研究、折腾并享受其中，比较生动地表达“可玩性高”。","note":"社区黑话"},{"id":"技术口语-53","en":"plug and play","meaning":"即插即用：连接后即可使用，或者只需极少配置。它不一定表示完全不需要设置。","note":"/"},{"id":"技术口语-54","en":"webhook","meaning":"一种由事件触发的系统回调机制：事件发生后，系统主动向预先配置的URL发送HTTP请求。例如支付平台在付款完成后向商户系统通知结果。","note":"/"},{"id":"技术口语-55","en":"send a webhook","meaning":"触发并发送一次Webhook请求，把事件及相关数据推送到接收方配置的URL。","note":"/"},{"id":"技术口语-56","en":"on-premises","meaning":"部署在客户自己的场所或基础设施中，可译为“本地部署/客户现场部署”。不一定完全断网，也不一定由客户自行托管。","note":"/"},{"id":"技术口语-57","en":"log the devices into the network","meaning":"让设备登录、认证或接入网络。根据场景也可能表示注册设备、输入认证信息或使设备加入网络。","note":"一词多义"},{"id":"技术口语-58","en":"users and groups provisioning","meaning":"创建、更新、同步或撤销用户及用户组，并分配相应权限。可以自动完成，但provisioning本身不必然表示“自动同步”。","note":"一词多义"},{"id":"技术口语-59","en":"event streaming to…","meaning":"将事件数据持续或近实时地发送到某个系统，例如SIEM、消息队列或数据平台。","note":"一词多义"},{"id":"技术口语-60","en":"a castle-and-moat model","meaning":"“城堡与护城河模型”：重点保护网络边界，传统上对边界内部给予较高信任。常用来与“持续验证、默认不信任”的零信任模型对比。","note":"/"},{"id":"技术口语-61","en":"property","meaning":"技术语境中通常指对象或配置中的属性。根据具体界面或代码结构，可译为“属性、字段、配置项”。","note":"一词多义"},{"id":"技术口语-62","en":"configure port forwarding","meaning":"配置端口转发：让路由器把到达某个外部端口的流量转发给内网中的指定设备和端口。","note":"/"},{"id":"技术口语-63","en":"open holes in your firewall","meaning":"在防火墙上开放端口或放行规则，使外部流量能够进入。holes不是实际的“漏洞”，但可能扩大暴露面和安全风险。","note":"技术口语"},{"id":"技术口语-64","en":"NAT traversal techniques","meaning":"NAT穿透技术：帮助位于NAT或防火墙后的设备发现通信路径并建立连接，例如STUN、TURN和打洞技术。","note":"/"},{"id":"技术口语-65","en":"Endpoint-Independent Mapping (EIM)","meaning":"端点无关映射：同一内网IP和端口访问不同外部目标时，NAT通常复用同一个公网IP和端口映射。","note":"/"},{"id":"技术口语-66","en":"allow it through","meaning":"允许某个数据包、连接或流量通过路由器、防火墙或过滤规则。it具体指什么要看上下文。","note":"/"},{"id":"技术口语-67","en":"return traffic","meaning":"返回流量/回程流量：由通信对端返回的数据包。请求—响应场景中也可理解为响应流量。","note":"一词多义"},{"id":"技术口语-68","en":"outbound path","meaning":"出站路径：流量从本地设备或网络发往外部目标时经过的路径。","note":"/"},{"id":"技术口语-69","en":"return path","meaning":"回程路径：对端返回的流量到达本地设备所经过的路径，可能与出站路径不同。","note":"一词多义"},{"id":"技术口语-70","en":"Overlay Network","meaning":"覆盖网络\n在现有物理网络之上，再创建一层逻辑网络","note":"/"}],"Reddit黑话":[{"id":"Reddit黑话-2","en":"ELI5","meaning":"Explain Like I'm Five 的缩写：请用五岁小孩也能理解的方式解释，即“用最简单的话讲”。","note":"文化梗、社区黑话"},{"id":"Reddit黑话-3","en":"OP delivered","meaning":"OP 是原帖作者；表示楼主兑现了承诺、提供了大家等待的更新或证据。","note":"文化梗、社区黑话"},{"id":"Reddit黑话-4","en":"Well, that went great.","meaning":"字面是“进行得很顺利”，实际通常表示事情搞砸了。要结合结果和语气判断。","note":"讽刺和反话"},{"id":"Reddit黑话-5","en":"w/","meaning":"with 的非正式缩写，常见于论坛、笔记和产品参数中。","note":"网络简写"},{"id":"Reddit黑话-6","en":"flip-flop on it","meaning":"对某件事反复改变决定或立场、摇摆不定。不是“反复折腾设备”。","note":"固定表达"},{"id":"Reddit黑话-7","en":"The S in IoT is for Security.","meaning":"IoT中根本没有字母S，因此这是讽刺：“物联网设备根本谈不上安全”或“物联网安全？不存在的。”","note":"文化梗、讽刺"},{"id":"Reddit黑话-8","en":"top out at…","meaning":"最高达到某个数值或在某个水平停止增长，例如The speed tops out at 1 Gbps表示“最高速度只有1 Gbps”。","note":"固定搭配"},{"id":"Reddit黑话-9","en":"give a quick rundown on…","meaning":"快速、概括地介绍或说明某个主题。比“快速来看看”更强调提供一份简要说明。","note":"固定搭配"},{"id":"Reddit黑话-10","en":"curated content","meaning":"经过人工或算法筛选、整理和编排的内容，即“精选内容”，不是未经筛选的信息集合。","note":"产品/媒体术语"},{"id":"Reddit黑话-11","en":"X on steroids","meaning":"X的极度加强版或“超级版”，强调能力、规模或效果大幅增强，不一定带有正面评价。","note":"口语类比"},{"id":"Reddit黑话-12","en":"give a carp about…","meaning":"give a crap about的幽默或委婉变体，把crap换成鱼类carp，意思仍是“在乎”。","note":"委婉表达、文字游戏"},{"id":"Reddit黑话-13","en":"give a crap about…","meaning":"在乎、关心某事。常见于否定句：I don't give a crap表示“我根本不在乎”，语气比较粗俗。","note":"口语表达"},{"id":"Reddit黑话-14","en":"/s","meaning":"sarcasm的标记，放在句末表示前面的内容是讽刺或反话，避免读者当真。","note":"社区标记"},{"id":"Reddit黑话-15","en":"I would like to piggyback on this.","meaning":"我想在这个观点、请求或工作基础上继续补充。根据语境可表示“我也有类似需求”或“我想顺着这一点补充”。","note":"固定表达"},{"id":"Reddit黑话-16","en":"perm","meaning":"含义高度依赖语境：可指permanent（永久的）","note":"社区简写"},{"id":"Reddit黑话-17","en":"on par with…","meaning":"与某人或某事物处于相同水平，即“与……不相上下/相当”。","note":"固定搭配"},{"id":"Reddit黑话-18","en":"a good number of years","meaning":"相当多年、好些年。good在这里强调数量可观，不是“美好的几年”。","note":"模糊数量表达"},{"id":"Reddit黑话-19","en":"work like a top","meaning":"运转得非常顺畅、稳定或完美。top是陀螺；这一表达现在不算特别常见。","note":"习语"},{"id":"Reddit黑话-20","en":"OP","meaning":"Original Poster，发起帖子的人，即“原帖作者/楼主”；有时也可指original post，即“原帖”。","note":"社区黑话"},{"id":"Reddit黑话-21","en":"have a case of the Mondays","meaning":"有“星期一综合征”，指星期一没精神、烦躁或状态不好。来自流行文化，经常被幽默地用于人或设备。","note":"文化梗、习语"},{"id":"Reddit黑话-22","en":"The device has a case of the Mondays.","meaning":"幽默地说设备今天状态不好、莫名出问题。用于设备时可以意译为“今天突然抽风了”。","note":"文化梗、拟人化"},{"id":"Reddit黑话-23","en":"eat my words","meaning":"承认自己之前的话说错了，尤其是在事实证明自己判断错误后，可译为“收回前言/打脸认错”。","note":"习语"},{"id":"Reddit黑话-24","en":"Don't get on a soapbox.","meaning":"别开始长篇发表强烈观点或说教。soapbox源自过去有人站在肥皂箱上向公众演讲。","note":"习语"},{"id":"Reddit黑话-25","en":"flame post","meaning":"以攻击、辱骂或挑起激烈争吵为主的帖子，可译为“引战帖/开喷帖”。","note":"社区黑话"},{"id":"Reddit黑话-26","en":"stretch a week","meaning":"具体取决于宾语：可以表示“让某物撑一周”，也可以表示“把时间延长一周”。不能一律理解成“拖一周”。","note":"一词多义"},{"id":"Reddit黑话-27","en":"make it stretch a week","meaning":"让现有资源、预算、电量或供应勉强维持一周。","note":"固定表达"},{"id":"Reddit黑话-28","en":"stretch it by a week","meaning":"把期限延长一周。by a week明确表示增加一周。","note":"时间表达"},{"id":"Reddit黑话-29","en":"keep my nose in the app 24/7","meaning":"一直盯着、频繁查看或持续关注这个App。24/7是“一天24小时、一周7天”，通常带有夸张意味。","note":"形象表达"},{"id":"Reddit黑话-30","en":"chalk something up to…","meaning":"把某件事归因于某个原因，例如I chalked it up to a software bug表示“我认为这是软件Bug导致的”。","note":"固定搭配"},{"id":"Reddit黑话-31","en":"It was the router's fault. / It's on the router.","meaning":"“是路由器的锅”。chalk it up to the router更接近“把问题归因于路由器”。","note":"社区口语"},{"id":"Reddit黑话-32","en":"be stellar","meaning":"表现非常出色、一流。可形容产品、服务、性能或某人的工作。","note":"评价用语"},{"id":"Reddit黑话-33","en":"Your mileage may vary.\nYMMV","meaning":"不同人的实际体验或效果可能不同。表示前面的经验不一定适用于所有人。","note":"固定表达"},{"id":"Reddit黑话-34","en":"swag","meaning":"品牌周边、活动周边、赠品","note":"一词多义"}]}};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const KEY='term-lab-progress-v1';let records={};try{records=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
let state={items:[],index:0,current:null,deck:'quiz',submitted:false,round:{}};
function normEn(s){return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s-]/g,' ').replace(/\s+/g,' ').trim()}
function stem(w){if(w.length>5&&w.endsWith('ing'))return w.slice(0,-3);if(w.length>4&&w.endsWith('ed'))return w.slice(0,-2);if(w.length>4&&w.endsWith('es'))return w.slice(0,-2);if(w.length>3&&w.endsWith('s'))return w.slice(0,-1);return w}
function editSim(a,b){if(a===b)return 1;if(!a||!b)return 0;let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return 1-p[b.length]/Math.max(a.length,b.length)}
function dice(a,b){a=a.replace(/\s+/g,'');b=b.replace(/\s+/g,'');if(!a||!b)return 0;const ng=s=>s.length<2?[s]:Array.from({length:s.length-1},(_,i)=>s.slice(i,i+2));let A=ng(a),B=ng(b),u=new Set(),h=0;A.forEach(x=>{let i=B.findIndex((y,j)=>y===x&&!u.has(j));if(i>=0){u.add(i);h++}});return 2*h/(A.length+B.length)}
function englishSimilarity(user,expected){let u=normEn(user),e=normEn(expected);if(!u||!e)return 0;if(u===e)return 1;let U=u.split(' ').map(stem),E=e.split(' ').map(stem),used=new Set(),hit=0;for(const x of E){let i=U.findIndex((y,j)=>!used.has(j)&&(x===y||editSim(x,y)>=.8));if(i>=0){used.add(i);hit++}}let cov=hit/Math.max(E.length,1),pre=hit/Math.max(U.length,1),f1=(cov+pre)?2*cov*pre/(cov+pre):0;return Math.max(.65*f1+.2*editSim(u,e)+.15*dice(u,e),cov===1?Math.min(.96,.82+.02*E.length):0)}
function normZh(s){return String(s||'').toLowerCase().replace(/[\s\p{P}\p{S}]/gu,'').replace(/用户群体/g,'用户').replace(/解决方案/g,'方案').replace(/进行/g,'').replace(/用于/g,'')}
function chineseSimilarity(user,expected){let u=normZh(user),e=normZh(expected);if(!u||!e)return 0;if(u===e||u.includes(e)||e.includes(u))return 1;return Math.max(.48*dice(u,e)+.32*editSim(u,e),.72*dice(u,e))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function showToast(m){let t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('show'),1600)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){}updateStats()}
function updateStats(){let v=Object.values(records),c=g=>v.filter(x=>x.grade===g).length;$('#goodStat').textContent=c('correct');$('#basicStat').textContent=c('basic');$('#badStat').textContent=c('wrong')}
function currentKey(){return state.deck==='quiz'?state.current.key:state.current.id}
function setGrade(g,review=false){let k=currentKey();records[k]={grade:g,at:Date.now()};state.round[k]=g;save();let scope=review?'#reviewArea':'#result';$$(scope+' .grade').forEach(b=>b.classList.toggle('selected',b.dataset.grade===g));$(review?'#reviewSaved':'#savedNote').textContent='已记录，可随时修改。';if(g!=='wrong')fireworks()}
function fireworks(){let host=$('#question'),f=document.createElement('div');f.className='firework';for(let i=0;i<16;i++){let s=document.createElement('i');s.className='spark';s.style.setProperty('--angle',(i*22.5)+'deg');s.style.setProperty('--distance',(34+Math.random()*34)+'px');f.appendChild(s)}host.appendChild(f);setTimeout(()=>f.remove(),850)}
function build(){state.deck=$('#deck').value;let n=$('#count').value;if(state.deck==='quiz'){let dir=$('#direction').value,arr=[];DATA.quiz.forEach(x=>{if(dir!=='zh-en')arr.push({...x,direction:'en-zh',key:x.id+'-en-zh'});if(dir!=='en-zh')arr.push({...x,direction:'zh-en',key:x.id+'-zh-en'})});state.items=shuffle(arr)}else state.items=shuffle(DATA.review[state.deck].map(x=>({...x})));if(n!=='all')state.items=state.items.slice(0,Number(n));state.index=0;state.round={};$('#empty').hidden=true;$('#summary').classList.remove('show');$('#question').hidden=false;show()}
function show(){if(state.index>=state.items.length){finish();return}state.current=state.items[state.index];state.submitted=false;$('#counter').textContent=`${state.index+1} / ${state.items.length}`;$('#bar').style.width=`${(state.index+1)/state.items.length*100}%`;$('#result').className='result';$('#revealCard').classList.remove('show');$$('.grade').forEach(b=>b.classList.remove('selected'));$('#savedNote').textContent='';$('#reviewSaved').textContent='';if(state.deck==='quiz')showQuiz();else showReview()}
function showQuiz(){let q=state.current;$('#quizArea').hidden=false;$('#reviewArea').hidden=true;$('#modeLabel').textContent=q.direction==='en-zh'?'英文 → 中文':'中文 → 英文';$('#promptLabel').textContent=q.direction==='en-zh'?'写出对应的中文意思':'写出对应的英文表达';$('#prompt').textContent=q.direction==='en-zh'?q.en:q.zh;$('#context').textContent=q.section?`${q.tier} · ${q.section}`:'';$('#instruction').textContent=q.direction==='en-zh'?'不需要和原文逐字一致，表达出主要意思即可。':'词形或轻微拼写差异会宽松判断。';$('#answer').value='';$('#answer').disabled=false;$('#submit').hidden=false;$('#reveal').hidden=false;$('#next').hidden=true;$('#sourceNote').textContent='来源：运营专业';setTimeout(()=>$('#answer').focus(),50)}
function showReview(){let q=state.current;$('#quizArea').hidden=true;$('#reviewArea').hidden=false;$('#modeLabel').textContent=state.deck+' · 点击复习';$('#promptLabel').textContent='先回忆这个英文表达的意思';$('#prompt').textContent=q.en;$('#context').textContent='';$('#showMeaning').hidden=false;$('#reviewNext').hidden=true;$('#meaning').textContent=q.meaning;$('#noteTag').textContent=q.note||state.deck;$('#noteTag').style.display=(q.note||state.deck)?'inline-block':'none';$('#sourceNote').textContent='来源：'+state.deck}
function evaluate(){let q=state.current,u=$('#answer').value.trim();if(!u){$('#answer').classList.remove('invalid');void $('#answer').offsetWidth;$('#answer').classList.add('invalid');showToast('先写下你的答案吧');return}let score;if(q.direction==='zh-en')score=englishSimilarity(u,q.en);else score=Math.max(chineseSimilarity(u,q.zh),chineseSimilarity(u,q.meaning));let grade=score>=.82?'correct':score>=(q.direction==='zh-en'?.50:.40)?'basic':'wrong';renderResult(grade,grade==='correct'?'主要含义已经命中。':grade==='basic'?'方向基本正确，可以对照原词条再确认。':'暂时没有命中主要含义。');state.submitted=true;$('#answer').disabled=true;$('#submit').hidden=true;$('#reveal').hidden=true;$('#next').hidden=false;setGrade(grade,false)}
function revealAnswer(){renderResult('wrong','已直接查看答案，本题先记录为“还不熟哦”。');state.submitted=true;$('#answer').disabled=true;$('#submit').hidden=true;$('#reveal').hidden=true;$('#next').hidden=false;setGrade('wrong',false)}
function renderResult(g,sub){let q=state.current,r=$('#result');r.className='result show '+g;$('#resultIcon').textContent=g==='wrong'?'×':'✓';$('#resultTitle').textContent=g==='correct'?'答对啦':g==='basic'?'基本正确':'还不熟哦';$('#resultSub').textContent=sub;$('#reference').textContent=`英文：${q.en}\n中文：${q.zh}\n原含义：${q.meaning}`;if(g!=='wrong')fireworks()}
function revealMeaning(){let c=$('#revealCard');c.classList.add('show');$('#showMeaning').hidden=true;$('#reviewNext').hidden=false;c.scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){state.index++;show()}
function finish(){$('#question').hidden=true;$('#summary').classList.add('show');let v=Object.values(state.round),c=g=>v.filter(x=>x===g).length;$('#sumGood').textContent=c('correct');$('#sumBasic').textContent=c('basic');$('#sumBad').textContent=c('wrong')}
$('#deck').addEventListener('change',()=>{$('#directionField').style.display=$('#deck').value==='quiz'?'block':'none'});$('#start').onclick=build;$('#again').onclick=build;$('#submit').onclick=evaluate;$('#reveal').onclick=revealAnswer;$('#next').onclick=next;$('#showMeaning').onclick=revealMeaning;$('#reviewNext').onclick=next;$('#answer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!state.submitted)evaluate()});$$('#result .grade').forEach(b=>b.onclick=()=>setGrade(b.dataset.grade,false));$$('.review-grade').forEach(b=>b.onclick=()=>setGrade(b.dataset.grade,true));$('#reset').onclick=()=>{if(confirm('确定清除当前浏览器中的全部学习记录吗？')){records={};save();showToast('学习记录已清除')}};$('#bankCount').textContent=`运营专业 ${DATA.quiz.length} 词 · 点击复习 ${Object.values(DATA.review).flat().length} 条`;updateStats();
</script>
</body></html>
